<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico - Transporte Universitário</title>

    <link rel="icon" type="image/x-icon" href="img/logoTrasporte.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="container py-4">
        <!-- Cabeçalho e Métricas -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h4 class="fw-bold text-body mb-1">
                    <i class="bi bi-clock-history me-2 text-primary"></i>Histórico de Passagens
                </h4>
                <p class="text-body-secondary small mb-0">Consulte e gerencie todas as suas passagens adquiridas.</p>
            </div>

            <div class="d-flex gap-2">
                <div class="card bg-body-tertiary border-secondary-subtle px-3 py-2 text-center">
                    <span class="extra-small text-body-secondary d-block">Total de Viagens</span>
                    <strong id="statTotalViagens" class="text-body fs-6">0</strong>
                </div>
                <div class="card bg-body-tertiary border-secondary-subtle px-3 py-2 text-center">
                    <span class="extra-small text-body-secondary d-block">Total Gasto</span>
                    <strong id="statTotalGasto" class="text-success fs-6">R$ 0,00</strong>
                </div>
            </div>
        </div>

        <!-- Filtro Rápido -->
        <div class="card border-secondary-subtle bg-body-tertiary shadow-sm mb-4">
            <div class="card-body py-2 px-3">
                <div class="row g-2 align-items-center">
                    <div class="col-md-8">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-transparent border-secondary-subtle text-body-secondary">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="inputBuscaHistorico" class="form-control bg-transparent border-secondary-subtle" placeholder="Buscar por origem ou destino..." onkeyup="filtrarHistorico()">
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-outline-secondary btn-sm w-100" onclick="carregarHistorico()">
                            <i class="bi bi-arrow-clockwise me-1"></i> Atualizar Lista
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Conteúdo do Histórico -->
        <div id="historico">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-body-secondary small">Carregando seu histórico de passagens...</p>
            </div>
            
        </div>
        <!-- BARRA DE ATALHOS RÁPIDOS PARA CELULAR E TABLET -->
<nav class="quick-shortcuts">
    <div class="shortcut-items">
        <a href="dashboard.html" class="shortcut-item">
            <i class="bi bi-house-door"></i>
            <span>Início</span>
        </a>
        <a href="rotas.html" class="shortcut-item">
            <i class="bi bi-signpost-split"></i>
            <span>Rotas</span>
        </a>
        <a href="passagens.html" class="shortcut-item">
            <i class="bi bi-ticket-perforated"></i>
            <span>Passagens</span>
        </a>
        <a href="carteira.html" class="shortcut-item">
            <i class="bi bi-wallet2"></i>
            <span>Carteira</span>
        </a>
        <a href="perfil.html" class="shortcut-item">
            <i class="bi bi-person-circle"></i>
            <span>Perfil</span>
        </a>
    </div>
</nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/components.js"></script>
    <script src="js/historico.js"></script>
</body>

</html>
