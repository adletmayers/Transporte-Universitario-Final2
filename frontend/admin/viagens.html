<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="../img/logoTrasporte.ico">
    <title>Admin - Gerenciamento de Viagens</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar Injetada Dinamicamente -->
    <div id="navbar-container"></div>

    <main class="container my-4">
        
        <!-- Cabeçalho da Página -->
        <div class="page-header mb-4">
            <h2>
                <i class="bi bi-bus-front me-2"></i>Gerenciamento de Viagens
            </h2>
            <p class="text-muted mb-0">Painel administrativo de controle de rotas, horários e vagas disponíveis.</p>
        </div>

        <!-- Formulário de Cadastro / Edição -->
        <div class="card p-4 mb-4">
            <h4 id="tituloPagina" class="mb-3">
                <i class="bi bi-plus-circle me-2"></i>Cadastrar Nova Viagem
            </h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary small">Origem</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        <input id="origem" class="form-control" placeholder="Ex: Campus Central">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small">Destino</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-pin-map"></i></span>
                        <input id="destino" class="form-control" placeholder="Ex: Terminal Rodoviário">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-secondary small">Data da Viagem</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                        <input id="data" type="date" class="form-control">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-secondary small">Horário de Saída</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-clock"></i></span>
                        <input id="saida" type="time" class="form-control">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-secondary small">Horário de Chegada</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-clock-history"></i></span>
                        <input id="chegada" type="time" class="form-control">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small">Valor da Passagem (R$)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                        <input id="valor" type="number" step="0.01" class="form-control" placeholder="0.00">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small">Quantidade de Vagas</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-seat"></i></span>
                        <input id="vagas" type="number" class="form-control" placeholder="0">
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <button id="btnSalvar" class="btn btn-success px-4" onclick="salvar()">
                    <i class="bi bi-check-lg me-1"></i>Cadastrar Viagem
                </button>
            </div>
        </div>

        <!-- Tabela de Viagens -->
        <div class="card p-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <h4 class="mb-0">Viagens Cadastradas</h4>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-repeat me-1"></i> Atualizar Lista
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="table-resumo w-100" style="min-width: 850px;">
                    <thead>
                        <tr>
                            <th style="text-align: left;">ID</th>
                            <th style="text-align: left;">Origem</th>
                            <th style="text-align: left;">Destino</th>
                            <th style="text-align: left;">Data</th>
                            <th style="text-align: left;">Horário</th>
                            <th style="text-align: left;">Valor</th>
                            <th style="text-align: left;">Vagas</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaViagens">
                        <!-- Preenchido via viagens.js -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mt-4 pt-3 border-top border-secondary">
                <div class="text-muted small">
                    Total de Viagens Registradas: <span id="totalViagens" class="fw-bold text-success">0</span>
                </div>
                <nav aria-label="Navegação da tabela">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item disabled"><a class="page-link" href="#">«</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">»</a></li>
                    </ul>
                </nav>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="../js/tema.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/viagens.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
