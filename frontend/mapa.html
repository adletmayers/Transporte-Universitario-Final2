<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa da Frota - Transporte Universitário</title>
    <link rel="icon" type="image/x-icon" href="img/logoTrasporte.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
        }
        .sidebar-card {
            background-color: #12181f;
            border: 1px solid #232e3c;
        }
    </style>
</head>
<body class="bg-dark text-light">

<div id="navbar-container"></div>

<div class="container-fluid px-4 mt-4">
    <h3 class="mb-3 fw-bold"><i class="bi bi-map me-2"></i>Mapa da Frota | Mapa</h3>

    <div class="row g-3">
        <!-- Sidebar de Filtros e Resumo -->
        <div class="col-lg-3">
            <!-- Legenda -->
            <div class="card sidebar-card mb-3 text-light">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Legenda</h6>
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-bus-front-fill text-success me-2"></i> Ônibus em Trânsito
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-geo-alt-fill text-info me-2"></i> Parada
                    </div>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-pin-map-fill text-warning me-2"></i> Ponto de Interesse
                    </div>
                </div>
            </div>

            <!-- Filtros da Frota -->
            <div class="card sidebar-card mb-3 text-light">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Filtros da Frota</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="linhaA" checked>
                        <label class="form-check-label" for="linhaA">Linha A - Campus Central</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="linhaB" checked>
                        <label class="form-check-label" for="linhaB">Linha B - Campus Saúde</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="linhaC">
                        <label class="form-check-label" for="linhaC">Linha C - Residência Norte</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="linhaD">
                        <label class="form-check-label" for="linhaD">Linha D - Laboratórios Sul</label>
                    </div>
                </div>
            </div>

            <!-- Resumo Rápido -->
            <div class="card sidebar-card text-light">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Resumo Rápido</h6>
                    <p class="mb-1 small">Total de Ônibus na Frota: <strong id="totalFrota">4</strong></p>
                    <p class="mb-1 small">Ônibus Online: <strong id="totalOnline" class="text-success">1</strong></p>
                    <p class="mb-1 small">Ônibus Offline: <strong id="totalOffline" class="text-secondary">3</strong></p>
                    <p class="mb-0 small">Coordenadas: <strong id="coordenadas" class="text-info">Carregando...</strong></p>
                </div>
            </div>
        </div>

        <!-- Conteúdo do Mapa -->
        <div class="col-lg-9">
            <div class="card sidebar-card p-2">
                <div id="map"></div>
                <div class="d-flex justify-content-between align-items-center mt-2 px-2">
                    <button class="btn btn-outline-light btn-sm" onclick="recentrarMapa()">
                        <i class="bi bi-arrow-counterclockwise me-1"></i> Recentrar no Campus
                    </button>
                    <span id="status" class="badge bg-success px-3 py-2">🟢 Monitorando em Tempo Real</span>
                </div>
            </div>
        </div>

    </div>
    <!-- BARRA DE ATALHOS RÁPIDOS PARA CELULAR E TABLET -->
<nav class="quick-shortcuts">
    <div class="shortcut-items">
        <a href="dashboard.html" class="shortcut-item">
            <i class="bi bi-house-door"></i>
            <span>Início</span>
        </a>
        <a href="rotas.html" class="shortcut-item">
            <i class="bi bi-signpost-split"></i>
            <span>Rotas</span>
        </a>
        <a href="passagens.html" class="shortcut-item">
            <i class="bi bi-ticket-perforated"></i>
            <span>Passagens</span>
        </a>
        <a href="carteira.html" class="shortcut-item">
            <i class="bi bi-wallet2"></i>
            <span>Carteira</span>
        </a>
        <a href="perfil.html" class="shortcut-item">
            <i class="bi bi-person-circle"></i>
            <span>Perfil</span>
        </a>
    </div>
</nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/tema.js"></script>
<script src="js/components.js"></script>
<script src="js/mapa.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
